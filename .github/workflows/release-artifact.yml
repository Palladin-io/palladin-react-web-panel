name: Release artifact

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  attest-web-bundle:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TEST_RUN_ID: ${{ github.event.workflow_run.id }}
      TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Checkout the tested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Build the tested web bundle
        run: |
          set -euo pipefail
          npm ci
          npm run build
          release="$RUNNER_TEMP/web-release"
          mkdir -p "$release"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$release/palladin-web-$SOURCE_SHA.tar.gz" -C dist .

      - name: Generate the web bundle SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ github.workspace }}
          format: spdx-json
          output-file: ${{ runner.temp }}/web-release/sbom-web.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Bind the artifact to its source and successful test run
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/web-release"
          artifact="palladin-web-$SOURCE_SHA.tar.gz"
          sbom="sbom-web.spdx.json"
          artifact_sha256="$(sha256sum "$release/$artifact" | cut -d ' ' -f 1)"
          sbom_sha256="$(sha256sum "$release/$sbom" | cut -d ' ' -f 1)"
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg testRunId "$TEST_RUN_ID" \
            --arg testRunUrl "$TEST_RUN_URL" \
            --arg artifact "$artifact" \
            --arg artifactSha256 "$artifact_sha256" \
            --arg sbom "$sbom" \
            --arg sbomSha256 "$sbom_sha256" \
            '{schemaVersion: 1, sourceSha: $sourceSha, testRunId: $testRunId,
              testRunUrl: $testRunUrl, artifact: {name: $artifact, sha256: $artifactSha256},
              sbom: {name: $sbom, sha256: $sbomSha256}}' \
            > "$release/release-manifest-web.json"
          (cd "$release" && sha256sum "$artifact" "$sbom" release-manifest-web.json \
            > SHA256SUMS-web)
          (cd "$release" && sha256sum --check SHA256SUMS-web)

      - name: Attest the web bundle
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/web-release/palladin-web-${{ env.SOURCE_SHA }}.tar.gz

      - name: Attest the web bundle SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/web-release/palladin-web-${{ env.SOURCE_SHA }}.tar.gz
          sbom-path: ${{ runner.temp }}/web-release/sbom-web.spdx.json

      - name: Retain the attested web release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/web-release/*
          if-no-files-found: error
          retention-days: 30
