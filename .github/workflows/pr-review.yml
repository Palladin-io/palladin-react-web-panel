name: "Claude Code: PR Review"

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      user_context:
        description: "Optional user instructions from @claude review comment"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CLAUDE_MODEL: claude-opus-4-7

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' &&
       github.actor != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch'
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.pr.outputs.number }}
          HEAD=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          git fetch origin "$HEAD"
          git checkout -B "$HEAD" "origin/$HEAD"

      - name: Fetch PR data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.pr.outputs.number }}
          gh pr view "$PR" --json number,title,body,author,additions,deletions,changedFiles,headRefName,baseRefName > /tmp/pr_meta.json
          gh pr diff "$PR" > /tmp/pr_diff.patch
          gh pr view "$PR" --json files --jq '.files[].path' > /tmp/pr_files.txt

      - name: Run Claude Code review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          USER_CONTEXT: ${{ github.event.inputs.user_context }}
        run: |
          PR=${{ steps.pr.outputs.number }}

          {
            echo '## Pre-fetched PR data'
            echo ''
            echo 'Use these files instead of running gh commands:'
            echo '- /tmp/pr_meta.json — metadata (read with: jq . /tmp/pr_meta.json)'
            echo '- /tmp/pr_diff.patch — full diff (use Read tool)'
            echo '- /tmp/pr_files.txt — changed file paths (use Read tool)'
            echo ''
            echo '---'
            echo ''
            sed "s/\$ARGUMENTS/${PR}/g" .claude/skills/pr-review/SKILL.md \
              | grep -v '^!`'
            if [ -n "$USER_CONTEXT" ]; then
              echo ''
              echo '## Additional instructions'
              echo ''
              echo "$USER_CONTEXT"
            fi
          } > /tmp/review_prompt.md

          claude -p \
            --model "$CLAUDE_MODEL" \
            --max-turns 30 \
            --dangerously-skip-permissions \
            --allowedTools "Bash(gh:*),Bash(jq:*),Read,Glob,Grep" \
            < /tmp/review_prompt.md
